services:
  api:
    build: .
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env

  chat:
    build: .
    command: >
      uv run streamlit run streamlit_app.py
      --server.address 0.0.0.0 --server.port 8501
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      # El chat ahora es un cliente HTTP puro de la API (ver
      # streamlit_app.py); "api" es el nombre del servicio en la red
      # interna de docker-compose, no localhost.
      - API_BASE_URL=http://api:8000
    env_file:
      - .env
    depends_on:
      - api
