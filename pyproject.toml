[project]
name = "estimador-cag"
version = "0.1.0"
description = "Estimador con arquitectura CAG (Cache-Augmented Generation) construido con FastAPI"
authors = [
    { name = "pacovillena36", email = "pacovillena36@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-dotenv",
    "streamlit>=1.64.0",
    "httpx2",
    "litellm>=1.102.1",
    "structlog>=26.1.0",
    "jinja2>=3.1.6",
    "instructor>=1.17.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
